<div class="container">
  <div class="row mb-4">
    <div class="col">
      <h2>Задачи</h2>
      <button *ngIf="isAdmin$ | async" class="btn btn-primary" (click)="onAddProblem()">
        <i class="bi bi-plus-circle"></i> Добавить задачу
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Сложность</th>
              <th>Категория</th>
              <th>Примеры</th>
              <th>Решение</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let problem of problems$ | async">
              <td>{{ problem.id }}</td>
              <td>{{ problem.title }}</td>
              <td>
                <span [class]="'badge ' + getDifficultyClass(problem.difficulty)">
                  {{ problem.difficulty }}
                </span>
              </td>
              <td>{{ problem.category }}</td>
              <td>
                <div *ngFor="let example of problem.examples">
                  <strong>Вход:</strong> {{ example.input }}<br>
                  <strong>Выход:</strong> {{ example.output }}<br>
                  <span *ngIf="example.explanation">
                    <strong>Объяснение:</strong> {{ example.explanation }}
                  </span>
                </div>
              </td>
              <td>
                <pre><code>{{ problem.solution }}</code></pre>
              </td>
              <td>
                <button *ngIf="isAdmin$ | async" class="btn btn-sm btn-outline-primary me-1" (click)="onEditProblem(problem)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button *ngIf="isAdmin$ | async" class="btn btn-sm btn-outline-danger" (click)="onDeleteProblem(problem.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
