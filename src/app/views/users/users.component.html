<div class="container">
  <div class="row mb-4">
    <div class="col">
      <h2>Пользователи</h2>
      <button class="btn btn-primary" (click)="onAddUser()">
        <i class="bi bi-plus-circle"></i> Добавить пользователя
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя пользователя</th>
              <th>Email</th>
              <th>Роль</th>
              <th>Имя</th>
              <th>Фамилия</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users$ | async">
              <td>{{ user.id }}</td>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span [class]="'badge ' + getRoleClass(user.role)">
                  {{ user.role }}
                </span>
              </td>
              <td>{{ user.firstName || '-' }}</td>
              <td>{{ user.lastName || '-' }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" (click)="onEditUser(user)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="onDeleteUser(user.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
