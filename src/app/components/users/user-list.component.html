<div class="user-list-container">
  <h2>Пользователи</h2>

  <div class="loading" *ngIf="loading$ | async">
    Загрузка...
  </div>

  <div class="error" *ngIf="error$ | async as error">
    {{ error }}
  </div>

  <table mat-table [dataSource]="users$ | async" class="mat-elevation-z8">
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Имя пользователя</th>
      <td mat-cell *matCellDef="let user">
        <a [routerLink]="['/users', user.id]">{{ user.username }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="rating">
      <th mat-header-cell *matHeaderCellDef>Рейтинг</th>
      <td mat-cell *matCellDef="let user">
        <mat-form-field>
          <input matInput type="number" [value]="user.rating"
                 (change)="onRatingChange(user.id, $event.target.value)">
        </mat-form-field>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [routerLink]="['/users', row.id]"
        class="clickable-row"></tr>
  </table>
</div>
