<div class="problem-list-container">
  <div class="filters">
    <h3>Теги</h3>
    <div class="tags">
      @for (tag of tags; track tag.id) {
        <button
          class="tag-button"
          [class.selected]="isTagSelected(tag.id)"
          (click)="onTagSelect(tag.id)"
        >
          {{ tag.name }}
        </button>
      }
    </div>
  </div>

  <div class="problems">
    <div *ngIf="loading" class="loading">
      Загрузка задач...
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="problems-grid">
      @for (problem of problems; track problem.id) {
        <div class="problem-card">
          <h3>{{ problem.title }}</h3>
          <p class="difficulty" [ngClass]="problem.difficulty.toLowerCase()">
            {{ problem.difficulty }}
          </p>
          <div class="tags">
            @for (tag of problem.tags; track tag.id) {
              <span class="tag">
                {{ tag.name }}
              </span>
            }
          </div>
          <p class="description">{{ problem.description }}</p>
          <div class="actions">
            <button class="solve-button">Решить</button>
            <button class="edit-button">Редактировать</button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
